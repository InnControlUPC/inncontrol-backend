

# ================================
# InnControl - Docker Compose File
# ================================

# Shared environment variables for InnControl microservices
x-inncontrol-shared-env: &shared-env
  EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  # ---------------------------------
  # Zookeeper - Coordination service
  # ---------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - inncontrol-network

  # ---------------------------
  # Kafka - Message broker
  # ---------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - inncontrol-network

  # -------------------------------------
  # Eureka Server - Service discovery
  # -------------------------------------
  eureka-server:
    container_name: inncontrol-eureka
    build:
      context: eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
    networks:
      - inncontrol-network

  # ------------------------------------
  # API Gateway - Request routing
  # ------------------------------------
  api-gateway:
    container_name: inncontrol-api-gateway
    build:
      context: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *shared-env
    depends_on:
      - eureka-server
      - kafka
    networks:
      - inncontrol-network


  # =====================================
  # IAM Microservice + MySQL database
  # =====================================
  iam-mysql:
    image: mysql:8.0
    command: --port=3316
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: IamServiceDB
    volumes:
      - iam-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3316" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  iam-service:
    container_name: inncontrol-iam
    build:
      context: iam-service
    environment:
      <<: *shared-env
      MYSQL_IAM_HOST: iam-mysql
      MYSQL_IAM_PORT: 3316
      MYSQL_IAM_USERNAME: root
      MYSQL_IAM_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      iam-mysql:
        condition: service_healthy
    networks:
      - inncontrol-network


  # -----------------------------------------
  # Notifications Service - Async messaging
  # -----------------------------------------
  notifications-service:
    container_name: inncontrol-notifications
    build:
      context: notifications-service
    environment:
      <<: *shared-env
    depends_on:
      - kafka
    networks:
      - inncontrol-network

  # =========================================
  # Inventory Microservice + MySQL database
  # =========================================
  inventory-mysql:
    image: mysql:8.0
    command: --port=3310
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: InventService
    volumes:
      - inventory-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3310" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  inventory-service:
    container_name: inncontrol-inventory
    build:
      context: inventory-service
    environment:
      <<: *shared-env
      MYSQL_INVENTORY_HOST: inventory-mysql
      MYSQL_INVENTORY_PORT: 3310
      MYSQL_INVENTORY_USERNAME: root
      MYSQL_INVENTORY_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      inventory-mysql:
        condition: service_healthy
    networks:
      - inncontrol-network

  # =========================================
  # Profile Microservice + MySQL database
  # =========================================
  profile-mysql:
    image: mysql:8.0
    command: --port=3314
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: ProfileService
    volumes:
      - profile-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3314" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  profile-service:
    container_name: inncontrol-profile
    build:
      context: profile-service
    environment:
      <<: *shared-env
      MYSQL_PROFILE_HOST: profile-mysql
      MYSQL_PROFILE_PORT: 3314
      MYSQL_PROFILE_USERNAME: root
      MYSQL_PROFILE_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      profile-mysql:
        condition: service_healthy
    networks:
      - inncontrol-network

  # ========================================
  # Employees Microservice + MySQL database
  # ========================================
  employees-mysql:
    image: mysql:8.0
    command: --port=3311
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: employeesms
    volumes:
      - employees-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3311" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  employees-service:
    container_name: inncontrol-employees
    build:
      context: employee-service
    environment:
      <<: *shared-env
      MYSQL_EMPLOYEES_HOST: employees-mysql
      MYSQL_EMPLOYEES_PORT: 3311
      MYSQL_EMPLOYEES_USERNAME: root
      MYSQL_EMPLOYEES_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      employees-mysql:
        condition: service_healthy
    networks:
      - inncontrol-network

  # =============================================
  # Accommodation Microservice + MySQL database
  # =============================================
  accommodation-mysql:
    image: mysql:8.0
    command: --port=3312
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: accommodationms
    volumes:
      - accommodation-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3312" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  accommodation-service:
    container_name: inncontrol-accommodation
    build:
      context: accommodation-service
    environment:
      <<: *shared-env
      MYSQL_ACCOMMODATION_HOST: accommodation-mysql
      MYSQL_ACCOMMODATION_PORT: 3312
      MYSQL_ACCOMMODATION_USERNAME: root
      MYSQL_ACCOMMODATION_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      accommodation-mysql:
        condition: service_healthy
    networks:
      - inncontrol-network

  # =====================================
  # Task Microservice + MySQL database
  # =====================================
  task-mysql:
    image: mysql:8.0
    command: --port=3313
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: inncontrol_tasks
    volumes:
      - task-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3313" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  task-service:
    container_name: inncontrol-task
    build:
      context: task-service
    environment:
      <<: *shared-env
      MYSQL_TASK_HOST: task-mysql
      MYSQL_TASK_PORT: 3313
      MYSQL_TASK_USERNAME: root
      MYSQL_TASK_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      task-mysql:
        condition: service_healthy
    networks:
      - inncontrol-network


  # =====================================
  # Communications Microservice + MySQL database
  # =====================================
  communications-postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: communications_db
      POSTGRES_USER: communications_user
      POSTGRES_PASSWORD: communications_password
    ports:
      - "5892:5432"
    volumes:
      - communications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  communications-service:
    container_name: inncontrol-communications
    build:
      context: communications-service
    environment:
      <<: *shared-env
      POSTGRES_URL: jdbc:postgresql://communications-postgres:5432/communications_db
      POSTGRES_USER: communications_user
      POSTGRES_PASSWORD: communications_password
      PORT: 0
    depends_on:
      communications-postgres:
        condition: service_healthy
    networks:
      - inncontrol-network

# ========================
# Network configuration
# ========================
networks:
  inncontrol-network:
    driver: bridge

# ========================
# Volume declarations
# ========================
volumes:
  inventory-db-data:
  employees-db-data:
  accommodation-db-data:
  task-db-data:
  iam-db-data:
  communications-db-data:
  profile-db-data:

version: "3.9"

# InnControl environment setup
x-inncontrol-shared-env: &shared-env
  EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

# InnControl services
services:
  # Zookeeper and Kafka for messaging
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - inncontrol-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - inncontrol-network
  # Eureka server for service discovery
  eureka-server:
    container_name: inncontrol-eureka
    build:
      context: eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
    networks:
      - inncontrol-network
  # Api Gateway for routing requests
  api-gateway:
    container_name: inncontrol-api-gateway
    build:
      context: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *shared-env
    depends_on:
      - eureka-server
      - kafka
    networks:
      - inncontrol-network
  #  Notifications service for handling notifications
  notifications-service:
    container_name: inncontrol-notifications
    build:
      context: notifications-service
    environment:
      <<: *shared-env
    depends_on:
      - kafka
    networks:
      - inncontrol-network

  # Inventory microservice
  inventory-mysql:
    image: mysql:8.0
    command: --port=3310
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: InventService
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3310" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network

  inventory-service:
    container_name: inncontrol-inventory
    build:
      context: inventory-service
    environment:
      <<: *shared-env
      MYSQL_INVENTORY_HOST: inventory-mysql
      MYSQL_INVENTORY_PORT: 3310
      MYSQL_INVENTORY_USERNAME: root
      MYSQL_INVENTORY_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      - inventory-mysql
    networks:
      - inncontrol-network

  # Employees microservice
  employees-mysql:
    image: mysql:8.0
    command: --port=3311
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: employeesms
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3311" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network
  employees-service:
    container_name: inncontrol-employees
    build:
      context: employee-service
    environment:
      <<: *shared-env
      MYSQL_EMPLOYEES_HOST: employees-mysql
      MYSQL_EMPLOYEES_PORT: 3311
      MYSQL_EMPLOYEES_USERNAME: root
      MYSQL_EMPLOYEES_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      - employees-mysql
    networks:
      - inncontrol-network

  # Accommodation microservice
  accommodation-mysql:
    image: mysql:8.0
    command: --port=3312
    environment:
      MYSQL_ROOT_PASSWORD: Admin123admin
      MYSQL_DATABASE: accommodationms
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3312" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inncontrol-network
  accommodation-service:
    container_name: inncontrol-accommodation
    build:
      context: accommodation-service
    environment:
      <<: *shared-env
      MYSQL_ACCOMMODATION_HOST: accommodation-mysql
      MYSQL_ACCOMMODATION_PORT: 3312
      MYSQL_ACCOMMODATION_USERNAME: root
      MYSQL_ACCOMMODATION_PASSWORD: Admin123admin
      PORT: 0
    depends_on:
      - accommodation-mysql
    networks:
      - inncontrol-network

# Network configuration
networks:
  inncontrol-network:
    driver: bridge